<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17243b" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#31445f"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f65b8"/></marker>
    <style>
      text { font-family: "Microsoft YaHei UI", "Noto Sans SC", "Segoe UI", sans-serif; fill: #17243b; }
      .title { font-size: 42px; font-weight: 700; } .subtitle { font-size: 19px; fill: #647188; }
      .region-title { font-size: 28px; font-weight: 700; } .section-title { font-size: 22px; font-weight: 700; }
      .box-title { font-size: 19px; font-weight: 700; } .copy { font-size: 16px; fill: #56667d; } .small { font-size: 14px; fill: #647188; }
      .arrow { fill: none; stroke: #31445f; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-bi { fill: none; stroke: #31445f; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2f65b8; stroke-width: 2.6; marker-end: url(#arrowBlue); } .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect width="1200" height="1800" fill="#f8fafc"/>
