<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#66717f"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2877e6"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#149447"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ed790e"/></marker>
    <style>
      text { font-family: "Microsoft YaHei UI", "Noto Sans SC", "Segoe UI", sans-serif; fill: #17243b; }
      .title { font-size: 40px; font-weight: 750; } .subtitle { font-size: 18px; fill: #5d6b7f; }
      .column-title { font-size: 27px; font-weight: 750; } .section-title { font-size: 21px; font-weight: 750; }
      .box-title { font-size: 19px; font-weight: 700; } .copy { font-size: 15px; fill: #3f4f65; } .note { font-size: 14px; fill: #65748a; }
      .blue-box { fill: #f7faff; stroke: #3b82f6; stroke-width: 2; }
      .green-box { fill: #f4fbf4; stroke: #26a34e; stroke-width: 2; }
      .orange-box { fill: #fff8f1; stroke: #f07a11; stroke-width: 2; }
      .down-green { fill: none; stroke: #149447; stroke-width: 3; marker-end: url(#arrow-green); }
      .down-orange { fill: none; stroke: #ed790e; stroke-width: 3; marker-end: url(#arrow-orange); }
      .cross-gray { fill: none; stroke: #66717f; stroke-width: 2.5; marker-end: url(#arrow-gray); }
      .cross-blue { fill: none; stroke: #2877e6; stroke-width: 3; marker-end: url(#arrow-blue); }
      .cross-green { fill: none; stroke: #149447; stroke-width: 3; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1200" height="1800" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="title">GREAT Agent 总体架构</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">从实验计划、只读科研输入到 GREAT 求解与结果反馈</text>

  <!-- Column backgrounds -->
  <rect x="18" y="112" width="366" height="1648" fill="#f6f9ff" stroke="#2877e6" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="417" y="112" width="366" height="1648" fill="#f5fbf5" stroke="#188a3d" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="816" y="112" width="366" height="1648" fill="#fff9f3" stroke="#ed790e" stroke-width="3" stroke-dasharray="10 7"/>

  <!-- Column 1 -->
  <text x="201" y="158" text-anchor="middle" class="column-title">1. 用户与数据输入</text>
  <text x="201" y="199" text-anchor="middle" class="section-title">1.1 React Web 工作台</text>

  <rect x="50" y="225" width="302" height="92" class="blue-box"/>
  <text x="201" y="257" text-anchor="middle" class="box-title">科研用户</text>
  <text x="201" y="287" text-anchor="middle" class="copy">浏览器访问本地服务</text>

  <path d="M201 317 V343" class="cross-blue"/>
  <rect x="50" y="350" width="302" height="106" class="blue-box"/>
  <text x="201" y="383" text-anchor="middle" class="box-title">对话与参数卡片</text>
  <text x="201" y="413" text-anchor="middle" class="copy">自然语言描述实验目标</text>
  <text x="201" y="440" text-anchor="middle" class="note">静态/动态 · DF/TF · Float/Fixed</text>

  <path d="M201 456 V482" class="cross-blue"/>
  <rect x="50" y="489" width="302" height="94" class="blue-box"/>
  <text x="201" y="522" text-anchor="middle" class="box-title">计划审核</text>
  <text x="201" y="552" text-anchor="middle" class="copy">查看差异 · 接受修改 · 冻结计划</text>

  <path d="M201 583 V609" class="cross-blue"/>
  <rect x="50" y="616" width="302" height="106" class="blue-box"/>
  <text x="201" y="649" text-anchor="middle" class="box-title">运行看板</text>
  <text x="201" y="679" text-anchor="middle" class="copy">任务状态 · 日志 · 错误分类</text>
  <text x="201" y="706" text-anchor="middle" class="note">停止 / 重试 / 结果下载</text>

  <line x1="42" y1="766" x2="360" y2="766" stroke="#2877e6" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="201" y="811" text-anchor="middle" class="section-title">1.2 只读科研输入</text>

  <rect x="50" y="840" width="302" height="106" class="blue-box"/>
  <text x="201" y="874" text-anchor="middle" class="box-title">RINEX 观测文件</text>
  <text x="201" y="905" text-anchor="middle" class="copy">15 个测站 · 按年与 DOY 组织</text>
  <text x="201" y="931" text-anchor="middle" class="note">任务内不拆分测站</text>

  <rect x="50" y="978" width="302" height="118" class="blue-box"/>
  <text x="201" y="1012" text-anchor="middle" class="box-title">GNSS 产品文件</text>
  <text x="201" y="1043" text-anchor="middle" class="copy">导航 · 轨道 · 钟差 · DCB</text>
  <text x="201" y="1073" text-anchor="middle" class="copy">IFCB / UPD（按场景需要）</text>

  <rect x="50" y="1128" width="302" height="118" class="blue-box"/>
  <text x="201" y="1162" text-anchor="middle" class="box-title">模型与配置</text>
  <text x="201" y="1193" text-anchor="middle" class="copy">天线 · 潮汐 · ERP · 行星星历</text>
  <text x="201" y="1223" text-anchor="middle" class="copy">PPPFLT XML 模板</text>

  <rect x="50" y="1290" width="302" height="152" fill="#eaf2ff" stroke="#2877e6" stroke-width="2.5"/>
  <text x="201" y="1329" text-anchor="middle" class="box-title">输入边界</text>
  <text x="201" y="1364" text-anchor="middle" class="copy">只检查、只读取</text>
  <text x="201" y="1396" text-anchor="middle" class="copy">不改写原始科研数据</text>
  <text x="201" y="1427" text-anchor="middle" class="note">缺失输入时禁止创建任务</text>

  <rect x="50" y="1490" width="302" height="194" class="blue-box"/>
  <text x="201" y="1530" text-anchor="middle" class="box-title">本地运行入口</text>
  <text x="201" y="1570" text-anchor="middle" class="copy">127.0.0.1 Web 页面</text>
  <text x="201" y="1607" text-anchor="middle" class="copy">PowerShell 启动与停止</text>
  <text x="201" y="1644" text-anchor="middle" class="copy">真实运行前独立预检</text>

  <!-- Column 2 -->
  <text x="600" y="158" text-anchor="middle" class="column-title">2. 计划、安全与服务</text>
  <text x="600" y="199" text-anchor="middle" class="section-title">2.1 计划生成与安全闸门</text>

  <rect x="449" y="225" width="302" height="105" class="green-box"/>
  <text x="600" y="258" text-anchor="middle" class="box-title">Qwen 计划提案</text>
  <text x="600" y="289" text-anchor="middle" class="copy">自然语言 → Typed Plan 候选</text>
  <text x="600" y="315" text-anchor="middle" class="note">模型不生成命令、不直接执行</text>
  <path d="M600 330 V358" class="down-green"/>

  <rect x="449" y="365" width="302" height="100" class="green-box"/>
  <text x="600" y="399" text-anchor="middle" class="box-title">强类型计划校验</text>
  <text x="600" y="431" text-anchor="middle" class="copy">日期范围 · 15 测站 · 场景规则</text>
  <text x="600" y="455" text-anchor="middle" class="note">拒绝路径、命令与未知字段</text>
  <path d="M600 465 V493" class="down-green"/>

  <rect x="449" y="500" width="302" height="100" class="green-box"/>
  <text x="600" y="534" text-anchor="middle" class="box-title">差异预览与计划修订</text>
  <text x="600" y="566" text-anchor="middle" class="copy">卡片与对话共用提案流程</text>
  <text x="600" y="590" text-anchor="middle" class="note">每次接受生成新 revision</text>
  <path d="M600 600 V628" class="down-green"/>

  <rect x="449" y="635" width="302" height="100" class="green-box"/>
  <text x="600" y="669" text-anchor="middle" class="box-title">严格输入预检</text>
  <text x="600" y="701" text-anchor="middle" class="copy">逐日检查观测与产品文件</text>
  <text x="600" y="725" text-anchor="middle" class="note">全部存在才允许冻结</text>
  <path d="M600 735 V763" class="down-green"/>

  <rect x="449" y="770" width="302" height="96" class="green-box"/>
  <text x="600" y="804" text-anchor="middle" class="box-title">冻结计划与每日任务展开</text>
  <text x="600" y="836" text-anchor="middle" class="copy">实际日期集 → N 个每日任务</text>

  <line x1="441" y1="916" x2="759" y2="916" stroke="#188a3d" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="600" y="960" text-anchor="middle" class="section-title">2.2 FastAPI 服务与持久化</text>

  <rect x="449" y="990" width="302" height="96" class="green-box"/>
  <text x="600" y="1024" text-anchor="middle" class="box-title">Experiment / Plan Service</text>
  <text x="600" y="1056" text-anchor="middle" class="copy">创建实验 · 修订计划 · 冻结</text>
  <path d="M600 1086 V1114" class="down-green"/>

  <rect x="449" y="1121" width="302" height="96" class="green-box"/>
  <text x="600" y="1155" text-anchor="middle" class="box-title">Task Service</text>
  <text x="600" y="1187" text-anchor="middle" class="copy">任务状态机 · 停止 · 显式重试</text>
  <path d="M600 1217 V1245" class="down-green"/>

  <rect x="449" y="1252" width="302" height="104" class="green-box"/>
  <text x="600" y="1286" text-anchor="middle" class="box-title">SQLite + WAL</text>
  <text x="600" y="1318" text-anchor="middle" class="copy">计划 · 任务 · 尝试 · 事件</text>
  <text x="600" y="1344" text-anchor="middle" class="note">支持原子领取和服务恢复</text>

  <rect x="449" y="1404" width="302" height="112" class="green-box"/>
  <text x="600" y="1438" text-anchor="middle" class="box-title">HTTP 与 SSE API</text>
  <text x="600" y="1470" text-anchor="middle" class="copy">计划操作使用 HTTP</text>
  <text x="600" y="1499" text-anchor="middle" class="copy">状态与日志使用 SSE</text>

  <rect x="449" y="1564" width="302" height="120" fill="#e9f7ec" stroke="#188a3d" stroke-width="2.5"/>
  <text x="600" y="1600" text-anchor="middle" class="box-title">输出目录安全约束</text>
  <text x="600" y="1634" text-anchor="middle" class="copy">运行文件仅写入 Run Storage</text>
  <text x="600" y="1663" text-anchor="middle" class="note">XML · 日志 · FLT 结果</text>

  <!-- Column 3 -->
  <text x="999" y="158" text-anchor="middle" class="column-title">3. 执行与结果反馈</text>
  <text x="999" y="199" text-anchor="middle" class="section-title">3.1 Worker 执行链</text>

  <rect x="848" y="225" width="302" height="100" class="orange-box"/>
  <text x="999" y="259" text-anchor="middle" class="box-title">任务原子领取</text>
  <text x="999" y="291" text-anchor="middle" class="copy">领取 pending 每日任务</text>
  <text x="999" y="315" text-anchor="middle" class="note">并发上限由本地配置控制</text>
  <path d="M999 325 V353" class="down-orange"/>

  <rect x="848" y="360" width="302" height="100" class="orange-box"/>
  <text x="999" y="394" text-anchor="middle" class="box-title">GreatPppfltAdapter</text>
  <text x="999" y="426" text-anchor="middle" class="copy">结构化生成每日 config.xml</text>
  <text x="999" y="450" text-anchor="middle" class="note">路径约束 · 参数数组</text>
  <path d="M999 460 V488" class="down-orange"/>

  <rect x="848" y="495" width="302" height="100" class="orange-box"/>
  <text x="999" y="529" text-anchor="middle" class="box-title">Process Runner</text>
  <text x="999" y="561" text-anchor="middle" class="copy">调用 GREAT_PVT.exe</text>
  <text x="999" y="585" text-anchor="middle" class="note">记录 PID · 退出码 · 日志</text>
  <path d="M999 595 V623" class="down-orange"/>

  <rect x="848" y="630" width="302" height="100" class="orange-box"/>
  <text x="999" y="664" text-anchor="middle" class="box-title">Result Inspector</text>
  <text x="999" y="696" text-anchor="middle" class="copy">检查 15 个非空 FLT 文件</text>
  <text x="999" y="720" text-anchor="middle" class="note">缺失结果转为分类错误</text>
  <path d="M999 730 V758" class="down-orange"/>

  <rect x="848" y="765" width="302" height="100" class="orange-box"/>
  <text x="999" y="799" text-anchor="middle" class="box-title">任务状态落库</text>
  <text x="999" y="831" text-anchor="middle" class="copy">成功 / 失败 / 取消 / 中断</text>

  <line x1="840" y1="916" x2="1158" y2="916" stroke="#ed790e" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="999" y="960" text-anchor="middle" class="section-title">3.2 结果与运行控制</text>

  <rect x="848" y="990" width="302" height="104" class="orange-box"/>
  <text x="999" y="1024" text-anchor="middle" class="box-title">隔离任务目录</text>
  <text x="999" y="1056" text-anchor="middle" class="copy">config.xml · attempt.log · *.flt</text>
  <text x="999" y="1082" text-anchor="middle" class="note">每次尝试保留独立记录</text>
  <path d="M999 1094 V1122" class="down-orange"/>

  <rect x="848" y="1129" width="302" height="96" class="orange-box"/>
  <text x="999" y="1163" text-anchor="middle" class="box-title">实时事件流</text>
  <text x="999" y="1195" text-anchor="middle" class="copy">SSE 推送任务状态与日志</text>
  <path d="M999 1225 V1253" class="down-orange"/>

  <rect x="848" y="1260" width="302" height="96" class="orange-box"/>
  <text x="999" y="1294" text-anchor="middle" class="box-title">运行控制</text>
  <text x="999" y="1326" text-anchor="middle" class="copy">停止实验 · 重试失败任务</text>

  <rect x="848" y="1404" width="302" height="112" class="orange-box"/>
  <text x="999" y="1438" text-anchor="middle" class="box-title">结果展示与下载</text>
  <text x="999" y="1470" text-anchor="middle" class="copy">按日期、测站查看 FLT</text>
  <text x="999" y="1499" text-anchor="middle" class="copy">切换尝试并查看完整日志</text>

  <rect x="848" y="1564" width="302" height="120" fill="#fff1e4" stroke="#ed790e" stroke-width="2.5"/>
  <text x="999" y="1600" text-anchor="middle" class="box-title">可恢复任务闭环</text>
  <text x="999" y="1634" text-anchor="middle" class="copy">计划 → 执行 → 状态 → 结果</text>
  <text x="999" y="1663" text-anchor="middle" class="note">异常可定位，失败可重试</text>

  <!-- Cross-column flows -->
  <path d="M352 403 H441" class="cross-gray"/><text x="396" y="391" text-anchor="middle" class="note">需求</text>
  <path d="M352 893 H410 V685 H441" class="cross-blue"/><text x="395" y="875" text-anchor="middle" class="note">观测</text>
  <path d="M352 1037 H398 V685 H441" class="cross-gray"/>
  <path d="M352 1187 H386 V685 H441" class="cross-gray"/><text x="394" y="1168" text-anchor="middle" class="note">产品/模板</text>
  <path d="M751 818 H807 V275 H840" class="cross-gray"/><text x="796" y="798" text-anchor="middle" class="note">任务</text>
  <path d="M751 1460 H807 V1177 H840" class="cross-green"/><text x="795" y="1441" text-anchor="middle" class="note">SSE</text>
  <path d="M840 1460 H807 V669 H392 V669 H360" class="cross-gray"/><text x="793" y="697" text-anchor="middle" class="note">结果反馈</text>
</svg>
