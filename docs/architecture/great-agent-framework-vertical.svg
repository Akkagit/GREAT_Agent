<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2000" viewBox="0 0 1000 2000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17243b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#31445f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f65b8"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei UI", "Noto Sans SC", "Segoe UI", sans-serif; fill: #17243b; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #647188; }
      .region-title { font-size: 22px; font-weight: 700; }
      .section-title { font-size: 17px; font-weight: 700; }
      .box-title { font-size: 15px; font-weight: 700; }
      .copy { font-size: 13px; fill: #56667d; }
      .small { font-size: 12px; fill: #647188; }
      .arrow { fill: none; stroke: #31445f; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-bi { fill: none; stroke: #31445f; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2f65b8; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1000" height="2000" fill="#f8fafc"/>
  <text x="500" y="58" text-anchor="middle" class="title">GREAT Agent 总体架构</text>
  <text x="500" y="88" text-anchor="middle" class="subtitle">本地 Windows · PPPFLT 编排 · 输入只读 · 任务可恢复</text>

  <!-- User and interface -->
  <rect x="70" y="125" width="860" height="245" rx="22" fill="#f6f3ff" stroke="#806bb6" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="164" text-anchor="middle" class="region-title" fill="#624b9b">用户与 React Web 工作台</text>

  <rect x="105" y="195" width="170" height="130" rx="13" fill="#fff" stroke="#b9add8" stroke-width="1.5"/>
  <circle cx="190" cy="236" r="18" fill="#7c67b2" opacity="0.18"/>
  <circle cx="190" cy="228" r="8" fill="#6e58a6"/>
  <path d="M175 253 Q190 238 205 253" fill="#6e58a6"/>
  <text x="190" y="284" text-anchor="middle" class="box-title">科研用户</text>
  <text x="190" y="307" text-anchor="middle" class="small">浏览器本地访问</text>

  <rect x="300" y="195" width="180" height="130" rx="13" fill="#fff" stroke="#b9add8" stroke-width="1.5"/>
  <text x="390" y="228" text-anchor="middle" class="box-title">对话与参数卡片</text>
  <text x="390" y="255" text-anchor="middle" class="copy">自然语言提出目标</text>
  <text x="390" y="280" text-anchor="middle" class="copy">结构化编辑计划</text>
  <text x="390" y="305" text-anchor="middle" class="copy">查看字段差异</text>

  <rect x="505" y="195" width="180" height="130" rx="13" fill="#fff" stroke="#b9add8" stroke-width="1.5"/>
  <text x="595" y="228" text-anchor="middle" class="box-title">校验与计划确认</text>
  <text x="595" y="255" text-anchor="middle" class="copy">输入预检</text>
  <text x="595" y="280" text-anchor="middle" class="copy">接受修改</text>
  <text x="595" y="305" text-anchor="middle" class="copy">冻结后创建任务</text>

  <rect x="710" y="195" width="180" height="130" rx="13" fill="#fff" stroke="#b9add8" stroke-width="1.5"/>
  <text x="800" y="228" text-anchor="middle" class="box-title">运行看板</text>
  <text x="800" y="255" text-anchor="middle" class="copy">实时任务状态</text>
  <text x="800" y="280" text-anchor="middle" class="copy">日志与错误分类</text>
  <text x="800" y="305" text-anchor="middle" class="copy">结果查看与下载</text>

  <path d="M500 370 V408" class="arrow-bi"/>
  <text x="520" y="397" class="small">HTTP / SSE</text>

  <!-- Core API and planning -->
  <rect x="70" y="420" width="860" height="535" rx="22" fill="#f5f9ff" stroke="#2f65b8" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="500" y="460" text-anchor="middle" class="region-title" fill="#24579f">FastAPI Agent 核心</text>

  <rect x="105" y="490" width="790" height="180" rx="16" fill="#fbfdff" stroke="#7da5dc" stroke-width="1.6" class="dash"/>
  <text x="500" y="523" text-anchor="middle" class="section-title" fill="#24579f">计划生成与安全闸门</text>

  <rect x="130" y="548" width="170" height="92" rx="10" fill="#eef5ff" stroke="#a5c0e7"/>
  <text x="215" y="578" text-anchor="middle" class="box-title">Qwen 计划提案</text>
  <text x="215" y="604" text-anchor="middle" class="copy">自然语言</text>
  <text x="215" y="625" text-anchor="middle" class="small">→ Typed Plan</text>

  <rect x="320" y="548" width="170" height="92" rx="10" fill="#eef5ff" stroke="#a5c0e7"/>
  <text x="405" y="578" text-anchor="middle" class="box-title">差异审核</text>
  <text x="405" y="604" text-anchor="middle" class="copy">预览 · 接受 · 拒绝</text>
  <text x="405" y="625" text-anchor="middle" class="small">模型不能直接执行</text>

  <rect x="510" y="548" width="170" height="92" rx="10" fill="#eef5ff" stroke="#a5c0e7"/>
  <text x="595" y="578" text-anchor="middle" class="box-title">严格输入预检</text>
  <text x="595" y="604" text-anchor="middle" class="copy">日期 · 测站</text>
  <text x="595" y="625" text-anchor="middle" class="small">观测与产品文件</text>

  <rect x="700" y="548" width="170" height="92" rx="10" fill="#eef5ff" stroke="#a5c0e7"/>
  <text x="785" y="578" text-anchor="middle" class="box-title">计划版本与冻结</text>
  <text x="785" y="604" text-anchor="middle" class="copy">版本可追踪</text>
  <text x="785" y="625" text-anchor="middle" class="small">冻结后不可修改</text>

  <path d="M500 670 V704" class="arrow-blue"/>

  <rect x="105" y="716" width="790" height="196" rx="16" fill="#f4fbf7" stroke="#6cad8c" stroke-width="1.6"/>
  <text x="500" y="750" text-anchor="middle" class="section-title" fill="#276c51">服务与领域层</text>

  <rect x="130" y="780" width="170" height="96" rx="10" fill="#fff" stroke="#9bcbb3"/>
  <text x="215" y="811" text-anchor="middle" class="box-title">Experiment API</text>
  <text x="215" y="838" text-anchor="middle" class="copy">创建 · 修订 · 冻结</text>
  <text x="215" y="859" text-anchor="middle" class="small">HTTP 接口</text>

  <rect x="320" y="780" width="170" height="96" rx="10" fill="#fff" stroke="#9bcbb3"/>
  <text x="405" y="811" text-anchor="middle" class="box-title">Plan Service</text>
  <text x="405" y="838" text-anchor="middle" class="copy">日期展开</text>
  <text x="405" y="859" text-anchor="middle" class="small">场景与产品规则</text>

  <rect x="510" y="780" width="170" height="96" rx="10" fill="#fff" stroke="#9bcbb3"/>
  <text x="595" y="811" text-anchor="middle" class="box-title">Task Service</text>
  <text x="595" y="838" text-anchor="middle" class="copy">每日任务</text>
  <text x="595" y="859" text-anchor="middle" class="small">状态机与重试</text>

  <rect x="700" y="780" width="170" height="96" rx="10" fill="#fff" stroke="#9bcbb3"/>
  <text x="785" y="811" text-anchor="middle" class="box-title">事件与结果 API</text>
  <text x="785" y="838" text-anchor="middle" class="copy">SSE · 日志</text>
  <text x="785" y="859" text-anchor="middle" class="small">结果文件下载</text>

  <path d="M500 955 V995" class="arrow-blue"/>

  <!-- Worker -->
  <rect x="70" y="1008" width="860" height="354" rx="22" fill="#fffbf2" stroke="#d8a552" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="1048" text-anchor="middle" class="region-title" fill="#915c0d">独立 Worker 与确定性执行</text>

  <rect x="105" y="1080" width="180" height="148" rx="12" fill="#fff" stroke="#e3bd7e"/>
  <text x="195" y="1114" text-anchor="middle" class="box-title">任务领取与恢复</text>
  <text x="195" y="1144" text-anchor="middle" class="copy">SQLite 原子领取</text>
  <text x="195" y="1170" text-anchor="middle" class="copy">停止与显式重试</text>
  <text x="195" y="1196" text-anchor="middle" class="small">服务重启后恢复状态</text>

  <rect x="310" y="1080" width="180" height="148" rx="12" fill="#fff" stroke="#e3bd7e"/>
  <text x="400" y="1114" text-anchor="middle" class="box-title">GreatPppfltAdapter</text>
  <text x="400" y="1144" text-anchor="middle" class="copy">结构化生成 XML</text>
  <text x="400" y="1170" text-anchor="middle" class="copy">路径安全约束</text>
  <text x="400" y="1196" text-anchor="middle" class="small">确定性参数数组</text>

  <rect x="515" y="1080" width="180" height="148" rx="12" fill="#fff" stroke="#e3bd7e"/>
  <text x="605" y="1114" text-anchor="middle" class="box-title">Process Runner</text>
  <text x="605" y="1144" text-anchor="middle" class="copy">调用 GREAT_PVT.exe</text>
  <text x="605" y="1170" text-anchor="middle" class="copy">记录 PID 与退出码</text>
  <text x="605" y="1196" text-anchor="middle" class="small">保留每次运行日志</text>

  <rect x="720" y="1080" width="180" height="148" rx="12" fill="#fff" stroke="#e3bd7e"/>
  <text x="810" y="1114" text-anchor="middle" class="box-title">Result Inspector</text>
  <text x="810" y="1144" text-anchor="middle" class="copy">检查 15 个 FLT</text>
  <text x="810" y="1170" text-anchor="middle" class="copy">识别空文件与缺失</text>
  <text x="810" y="1196" text-anchor="middle" class="small">登记结果与错误类型</text>

  <path d="M285 1154 H302" class="arrow"/>
  <path d="M490 1154 H507" class="arrow"/>
  <path d="M695 1154 H712" class="arrow"/>
  <text x="500" y="1280" text-anchor="middle" class="copy">每个日期生成 1 个可恢复任务；每个任务保留 15 个测站</text>
  <path d="M500 1362 V1402" class="arrow"/>

  <!-- External resources -->
  <rect x="70" y="1415" width="860" height="365" rx="22" fill="#f3fbf7" stroke="#39866a" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="1455" text-anchor="middle" class="region-title" fill="#276c51">外部资源、求解程序与隔离输出</text>

  <rect x="105" y="1490" width="245" height="230" rx="14" fill="#fff" stroke="#8fc4aa" stroke-width="1.5"/>
  <text x="227" y="1525" text-anchor="middle" class="section-title">只读科研输入</text>
  <text x="132" y="1563" class="copy">• RINEX 观测文件</text>
  <text x="132" y="1595" class="copy">• 导航 / 轨道 / 钟差 / DCB</text>
  <text x="132" y="1627" class="copy">• 天线 / 潮汐 / ERP</text>
  <text x="132" y="1659" class="copy">• 行星星历</text>
  <text x="132" y="1691" class="copy">• PPPFLT XML 模板</text>

  <rect x="378" y="1490" width="245" height="230" rx="14" fill="#fff" stroke="#8fc4aa" stroke-width="1.5"/>
  <text x="500" y="1525" text-anchor="middle" class="section-title">GREAT_PVT.exe</text>
  <circle cx="500" cy="1600" r="40" fill="#e6f4ed" stroke="#39866a" stroke-width="2"/>
  <path d="M480 1600 H520 M500 1580 V1620" stroke="#39866a" stroke-width="4" stroke-linecap="round"/>
  <text x="500" y="1668" text-anchor="middle" class="copy">现有数值解算程序</text>
  <text x="500" y="1693" text-anchor="middle" class="small">由参数数组安全调用</text>

  <rect x="650" y="1490" width="245" height="230" rx="14" fill="#fff" stroke="#8fc4aa" stroke-width="1.5"/>
  <text x="772" y="1525" text-anchor="middle" class="section-title">隔离运行输出</text>
  <text x="677" y="1563" class="copy">• 每日任务目录</text>
  <text x="677" y="1595" class="copy">• 生成的 config.xml</text>
  <text x="677" y="1627" class="copy">• attempt.log</text>
  <text x="677" y="1659" class="copy">• 15 个测站 FLT</text>
  <text x="677" y="1691" class="copy">• 运行事件与结果索引</text>

  <path d="M350 1605 H370" class="arrow"/>
  <text x="360" y="1588" text-anchor="middle" class="small">读</text>
  <path d="M623 1605 H642" class="arrow"/>
  <text x="632" y="1588" text-anchor="middle" class="small">写</text>

  <path d="M500 1780 V1818" class="arrow-bi"/>

  <!-- Infrastructure -->
  <rect x="70" y="1832" width="860" height="130" rx="20" fill="#f4f7fb" stroke="#8091a9" stroke-width="1.8"/>
  <text x="500" y="1867" text-anchor="middle" class="region-title">本地基础设施与持久化</text>

  <rect x="105" y="1890" width="180" height="48" rx="9" fill="#fff" stroke="#b6c1cf"/>
  <text x="195" y="1910" text-anchor="middle" class="box-title">SQLite + WAL</text>
  <text x="195" y="1929" text-anchor="middle" class="small">计划 · 任务 · 事件</text>

  <rect x="310" y="1890" width="180" height="48" rx="9" fill="#fff" stroke="#b6c1cf"/>
  <text x="400" y="1910" text-anchor="middle" class="box-title">Run Storage</text>
  <text x="400" y="1929" text-anchor="middle" class="small">XML · 日志 · 结果</text>

  <rect x="515" y="1890" width="180" height="48" rx="9" fill="#fff" stroke="#b6c1cf"/>
  <text x="605" y="1910" text-anchor="middle" class="box-title">Windows 本机</text>
  <text x="605" y="1929" text-anchor="middle" class="small">127.0.0.1 · 原生进程</text>

  <rect x="720" y="1890" width="180" height="48" rx="9" fill="#fff" stroke="#b6c1cf"/>
  <text x="810" y="1910" text-anchor="middle" class="box-title">PowerShell 运维</text>
  <text x="810" y="1929" text-anchor="middle" class="small">start · stop · preflight</text>
</svg>
