mode = 'local'
project_root = 'F:\GREAT_Agent'
run_root = 'F:\GREAT_Agent\runs'
database_path = 'F:\GREAT_Agent\data\great_agent.db'
host = '127.0.0.1'
port = 8765
max_concurrency = 2
convergence_hold_seconds = 600

[model]
base_url = 'https://dashscope.aliyuncs.com/compatible-mode/v1'
name = 'qwen-plus'
connect_timeout_seconds = 10
read_timeout_seconds = 120

[pppflt]
executable = 'F:\GREAT_Agent\local\GREAT_PVT.exe'
template_path = 'F:\GREAT_Agent\local\templates\pppflt.xml'
observation_root = 'D:\GNSS\observations'
product_root = 'D:\GNSS\products'
default_concurrency = 1
observation_template = '{year}\{doy:03d}\{station_lower}{doy:03d}0.{yy:02d}o'
navigation_template = '{year}\{doy:03d}\brdm{year}{doy:03d}.rnx'
orbit_template = '{year}\{doy:03d}\igs{year}{doy:03d}.sp3'
clock_template = '{year}\{doy:03d}\igs{year}{doy:03d}.clk'
bias_template = '{year}\{doy:03d}\igs{year}{doy:03d}.bia'
ifcb_template = '{year}\{doy:03d}\igs{year}{doy:03d}.ifcb'
upd_template = '{year}\{doy:03d}\igs{year}{doy:03d}.upd'
antenna_template = 'models\igs20.atx'
tide_template = 'models\oceanload.blq'
erp_template = 'models\finals.erp'
planetary_template = 'models\de430.bsp'
