# Copy to config/local.trial.toml and review paths before any migration/start.
# One API process on loopback 8766 and one separately supervised Solver Worker.
# All invited users share this instance's data. Stage approved inputs only.
mode = 'local'
project_root = 'F:\GREAT_Agent'
run_root = 'F:\GREAT_Agent\runs\trial'
database_path = 'F:\GREAT_Agent\data\trial\great_agent.db'
host = '127.0.0.1'
port = 8766
max_concurrency = 1
convergence_hold_seconds = 600

[knowledge]
enabled = true
chat_enabled = true
root = 'F:\GREAT_Agent\data\trial\knowledge'
max_upload_bytes = 52428800
max_pages = 300
parser_timeout_seconds = 300
# Enable semantic search only after installing and checking local model files.
embedding_enabled = false
embedding_min_available_mb = 384
# Optional Docling support requires separate dependencies and local model files.
# docling_artifacts = 'F:\GREAT_Agent\local\docling-models'

[model]
# No API key belongs in TOML. Both real service processes must receive
# GREAT_AGENT_MODEL_API_KEY from their own service account environment.
base_url = 'https://open.bigmodel.cn/api/paas/v4'
name = 'glm-4.7'
response_format = 'json_object'
thinking = 'disabled'
max_tokens = 2048
connect_timeout_seconds = 10
read_timeout_seconds = 120
request_timeout_seconds = 180

[pppflt]
# Confirm the licensed executable/template and stage the administrator-approved
# GNSS inputs at these paths before starting the isolated trial instance.
executable = 'F:\GREAT_Agent\local\GREAT_PVT.exe'
template_path = 'F:\GREAT_Agent\local\templates\pppflt.xml'
observation_root = 'F:\GREAT_Agent\data\trial\inputs\observations'
product_root = 'F:\GREAT_Agent\data\trial\inputs\products'
default_concurrency = 1
observation_template = '{year}\{doy:03d}\{station_lower}{doy:03d}0.{yy:02d}o'
navigation_template = '{year}\{doy:03d}\brdm{year}{doy:03d}.rnx'
orbit_template = '{year}\{doy:03d}\igs{year}{doy:03d}.sp3'
clock_template = '{year}\{doy:03d}\igs{year}{doy:03d}.clk'
bias_template = '{year}\{doy:03d}\igs{year}{doy:03d}.bia'
ifcb_template = '{year}\{doy:03d}\igs{year}{doy:03d}.ifcb'
upd_template = '{year}\{doy:03d}\igs{year}{doy:03d}.upd'
antenna_template = 'models\igs20.atx'
tide_template = 'models\oceanload.blq'
erp_template = 'models\finals.erp'
planetary_template = 'models\de430.bsp'
