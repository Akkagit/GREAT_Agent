[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "great-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.4,<4.15",
  "fastapi>=0.115,<0.143",
  "httpx>=0.28,<1",
  "matplotlib>=3.9,<4",
  "psutil>=6,<8",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
great-agent = "great_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["backend/src/great_agent"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
asyncio_mode = "auto"
filterwarnings = ["error"]
