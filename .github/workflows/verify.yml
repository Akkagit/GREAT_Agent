name: Isolated verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GREAT_AGENT_MODEL_API_KEY: ''
      OPENAI_API_KEY: ''
      DASHSCOPE_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies from lockfile
        run: uv sync --frozen --group dev --python 3.11
      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci
      # Only repository fixtures, temporary databases, mock solver/provider and
      # in-process ASGI are used. The Python gate refuses external sockets/DNS.
      - name: Run release gate
        shell: pwsh
        run: ./scripts/verify.ps1 -Report tmp/verify/report.json -TimeoutSeconds 900
      - name: Preserve verification report and command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: tmp/verify/
          if-no-files-found: warn
          retention-days: 14
